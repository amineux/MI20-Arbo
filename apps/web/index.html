<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MI20 Arbo</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        background: #1b365d;
        color: #fff;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #boot-splash .bar {
        height: 56px;
        background: #16263a;
      }
      #boot-splash .body {
        flex: 1;
        padding: 32px 24px;
        max-width: 720px;
        margin: 0 auto;
        width: 100%;
        box-sizing: border-box;
      }
      #boot-splash h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 600;
      }
      #boot-splash p {
        margin: 0 0 24px;
        opacity: 0.8;
        font-size: 14px;
      }
      #boot-splash .sk {
        height: 14px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.12);
        margin-bottom: 10px;
        animation: pulse 1.1s ease-in-out infinite;
      }
      #boot-splash .sk.w2 { width: 72%; }
      #boot-splash .sk.w3 { width: 54%; }
      #boot-splash .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
        margin-top: 20px;
      }
      #boot-splash .card {
        height: 88px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-busy="true">
      <div class="bar"></div>
      <div class="body">
        <h1>MI20 Arbo</h1>
        <p>Plan de production documentaire · chargement…</p>
        <p style="font-size:12px;opacity:0.65">Si cet écran reste : Ctrl+Maj+R</p>
        <div class="sk"></div>
        <div class="sk w2"></div>
        <div class="sk w3"></div>
        <div class="cards">
          <div class="card"></div>
          <div class="card"></div>
          <div class="card"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
